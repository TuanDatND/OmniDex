spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/omnidex
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  mongodb:
    uri: mongodb://root:root@localhost:27017/omnidex?authSource=admin

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.springframework.security: debug